# Word §3.2 业务对象「目标行数」（测试记录展示用，与造数/校验技术目标 volume-profiles 分离）
# 实际行数仍从物理表统计；二者允许不一致（如原始报文含雷达/填充等）

objects:
  - key: mine_site
    label: 矿区
    table: mine_site
  - key: thunderstorm_process
    label: 雷暴过程
    table: thunderstorm_process
  - key: lightning_cmb
    label: 雷暴监测-大网
    table: standard_lightning_strike_cmb
  - key: lightning_locator
    label: 雷暴监测-小网
    table: standard_lightning_strike_locator
  - key: biz_lightning_event
    label: 雷暴监测业务事件
    table: biz_lightning_event
  - key: atmosphere_std
    label: 设备监测-大气电场
    table: standard_atmosphere_electric_field
  - key: atmosphere_biz
    label: 大气电场业务事件
    table: biz_atmosphere_electric_field_event
  - key: other_device
    label: 设备监测-其他
    aggregate: lowfreq_standard_sum
  - key: warning_event
    label: 雷暴预警
    table: thunderstorm_warning_event
  - key: warning_message
    label: 雷暴信息
    table: thunderstorm_warning_message
  - key: device_alarm
    label: 设备告警
    table: device_alarm_event
  - key: notice_event
    label: 雷暴工况联动
    table: thunderstorm_notice_event
  - key: inspection_task
    label: 巡检任务
    table: inspection_task
  - key: hidden_risk
    label: 隐患记录
    table: hidden_risk
  - key: repair_order
    label: 故障维修
    table: repair_order
  - key: raw_kafka_message
    label: 原始报文
    table: raw_kafka_message

