defaults:
  t0: "2025-06-01T00:00:00"
  timezone: "Asia/Shanghai"
  atmosphere_hz: 1
  # 每个雷暴过程 data_window 开头按 1 条/秒/台写入稠密段（PERF-05-1MIN 依赖）
  atmosphere_dense_minutes: 1
  # true=尽量铺满整个 data_window（受 atmosphere_rows 预算约束）；S5/S6 建议开启
  atmosphere_dense_full_window: false
  ingest_delay_max_seconds: 3
  thunderstorm_season_months: [6, 7, 8]
  thunderstorm_season_ratio: 0.7
  process_duration_min_minutes: 60
  process_duration_max_minutes: 180
  # 雷暴过程落在 [t0, t0+calendar_months)；6～8 月约 70%（见 thunderstorm_season_ratio）
  calendar_months: 12
  lightning_in_window_ratio: 0.85
  lightning_boundary_ratio: 0.10
  lightning_outlier_ratio: 0.05
