# 分阶段造数量（对齐 雷电系统数据库性能测试开展方案.docx §3.2）
# 有区间时取中位偏保守值，不顶格取上限（如 1500～2000 万 → 1700 万）
# 闪电：仅配置 lightning_cmb / lightning_locator；biz_lightning_event = cmb + loc（1:1 派生，无独立条数）
# atmosphere_rows：standard + biz 各写入相同行数
# raw_rows：全 Topic 合计 = atmosphere + 闪电 + 低频 + 雷达 + padding + 异常(~0.1%)
# radar_raw_rows：约 每过程 40 条（过程数 × 40）
# calendar_months：从 t0 所在月起连续铺开的自然月数；大气/raw 底量按月均分，雷暴过程 6～8 月加权

