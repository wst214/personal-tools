  # S9（PG 加压）：500 台 × 6 月 1～30 号真 1Hz，仅写大气 biz；std/raw 不写大气
  # 大气 biz = 500 × 86400 × 30 = 1296000000；raw ≈ 闪电+低频+雷达+异常（无大气）
