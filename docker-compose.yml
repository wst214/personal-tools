name: mytools-stack

services:

  mytools-personal-dev-site:
    build: ./personal-dev-site
    image: mytools-personal-dev-site
    container_name: mytools-personal-dev-site

    ports:

      - "8090:80"

    restart: unless-stopped

  mytools-linux-remote-panel:
    build: ./linux-remote-panel
    image: mytools-linux-remote-panel
    container_name: mytools-linux-remote-panel

    ports:

      - "5757:5757"

    volumes:

      - linux-remote-data:/data

      - ${USERPROFILE}/.ssh:/ssh-keys:ro

      - ./linux-remote-panel/config/wsl.defaults.json:/data/wsl.defaults.json:ro

    environment:

      - WSL_HELPER_URL=http://host.docker.internal:5758

    restart: unless-stopped

  mytools-tunnel-panel:
    build: ./tunnel-panel
    image: mytools-tunnel-panel
    container_name: mytools-tunnel-panel

    ports:

      - "5760:5760"

    extra_hosts:

      - "host.docker.internal:host-gateway"

    env_file:

      - ./tunnel-panel/.env

    environment:

      - TUNNEL_HOST_GATEWAY=host.docker.internal

    restart: unless-stopped

  mytools-ops-panel:
    build: ./stack-panel
    image: mytools-ops-panel
    container_name: mytools-ops-panel

    ports:

      - "5770:5770"

    volumes:

      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
      - ./stack-panel/data:/app/data
      - ${LEIDIAN_MAVEN_CACHE_HOST_PATH:-C:/Users/61021/.m2}:/root/.m2
      # Current deployment project; configure the host path without editing the panel.
      - ${LEIDIAN_DEPLOY_PROJECT_HOST_PATH:-D:/workspace/leidian/leidan-pgsql}:/deploy-project

    environment:

      - MYTOOLS_ROOT=/workspace
      - DEPLOY_PROJECT_HOST_PATH=${LEIDIAN_DEPLOY_PROJECT_HOST_PATH:-D:/workspace/leidian/leidan-pgsql}
      - DEPLOY_PROJECT_ROOT=/deploy-project
      - STACK_PANEL_PORT=5770

    restart: unless-stopped



  mytools-leidian-test-workbench:
    build: ./leidian-test-workbench
    image: mytools-leidian-test-workbench
    container_name: mytools-leidian-test-workbench

    ports:

      - "5785:5785"

    volumes:

      - ./leidian-test-workbench/data:/app/data

    extra_hosts:

      - "host.docker.internal:host-gateway"

    environment:

      - PORT=5785
      - HOST_GATEWAY=host.docker.internal

    restart: unless-stopped

  # TestHub MySQL（宿主机 :3307）
  mytools-testhub-mysql:
    image: mysql:8.0
    container_name: mytools-testhub-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: testhub
      MYSQL_USER: testhub
      MYSQL_PASSWORD: testhub123
    volumes:
      - testhub-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped

  # New API：多上游 LLM 统一转发（SQLite，个人本机用）
  mytools-new-api:
    image: calciumion/new-api:latest
    container_name: mytools-new-api
    expose:
      - "3000"
    volumes:
      - ./new-api/data:/data
    environment:
      - TZ=Asia/Shanghai
      - SERVER_ADDRESS=http://localhost:5780
    restart: unless-stopped

  # 同域网关：对外仍是 :5780，并提供 /auto-login.html 自动登录
  mytools-new-api-gateway:
    image: nginx:alpine
    container_name: mytools-new-api-gateway
    ports:
      - "5780:80"
    volumes:
      - ./new-api/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./new-api/auto-login.html:/usr/share/nginx/html/auto-login.html:ro
      - ./new-api/mytools-sw.js:/usr/share/nginx/html/mytools-sw.js:ro
    depends_on:
      - mytools-new-api
    restart: unless-stopped

  # AnythingLLM 知识库（DevToolbox :3002）
  mytools-anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: mytools-anythingllm
    ports:
      - "3002:3001"
    cap_add:
      - SYS_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      STORAGE_DIR: /app/server/storage
      JWT_SECRET: mytools-anythingllm-local-dev-secret-change-me
      DISABLE_TELEMETRY: "true"
      LLM_PROVIDER: generic-openai
      GENERIC_OPEN_AI_BASE_PATH: http://host.docker.internal:5780/v1
      GENERIC_OPEN_AI_MODEL_PREF: deepseek-v4-flash-0731
      EMBEDDING_ENGINE: native
    volumes:
      - ./dev-toolbox/anythingllm/storage:/app/server/storage
      - ./dev-toolbox/anythingllm/.env:/app/server/.env
    restart: unless-stopped

  # Stirling-PDF（DevToolbox :8090；与 personal-dev-site 同端口，勿同时启动两者）
  mytools-stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: mytools-stirling-pdf
    ports:
      - "8090:8080"
    environment:
      SECURITY_ENABLELOGIN: "false"
      DISABLE_ADDITIONAL_FEATURES: "false"
      SYSTEM_DEFAULTLOCALE: zh_CN
      SYSTEM_GOOGLEVISIBILITY: "false"
      SECURITY_XFRAMEOPTIONS: DISABLED
    volumes:
      - ./dev-toolbox/stirling-pdf/data:/configs
      - ./dev-toolbox/stirling-pdf/tessdata:/usr/share/tessdata
    restart: unless-stopped

volumes:
  linux-remote-data:
    external: true
    name: mytools_linux-remote-data
  testhub-mysql-data:
    name: mytools_testhub-mysql-data
    external: true




