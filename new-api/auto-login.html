<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New API 自动登录</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 14px/1.5 system-ui, sans-serif; color: #334155; background: #f8fafc;
    }
    .box { text-align: center; padding: 24px; }
    .err { color: #dc2626; margin-top: 8px; max-width: 420px; }
  </style>
</head>
<body>
  <div class="box">
    <div id="msg">正在自动登录…</div>
    <div id="err" class="err"></div>
  </div>
  <script>
    (async () => {
      const msg = document.getElementById('msg');
      const err = document.getElementById('err');
      const params = new URLSearchParams(location.search);
      const next = params.get('next') || '/console';

      let username = 'admin';
      let password = '';
      const hash = (location.hash || '').replace(/^#/, '');
      if (hash) {
        const i = hash.indexOf(':');
        if (i >= 0) {
          username = decodeURIComponent(hash.slice(0, i) || 'admin');
          password = decodeURIComponent(hash.slice(i + 1) || '');
        }
      }
      if (!password) {
        try {
          const j = JSON.parse(localStorage.getItem('mytools_newapi_auto_login') || '{}');
          username = j.username || username;
          password = j.password || '';
        } catch {}
      }

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      async function readJson(res) {
        const text = await res.text();
        if (!text || !String(text).trim()) {
          if (res.status === 429) throw new Error('登录太频繁被限流，请稍等几秒后点「刷新」');
          throw new Error('服务返回空响应 HTTP ' + res.status);
        }
        try {
          return JSON.parse(text);
        } catch {
          throw new Error('服务返回非 JSON（HTTP ' + res.status + '）：' + text.slice(0, 120));
        }
      }

      async function stashBundle(data) {
        if (!data || !data.access_token) return;
        const body = JSON.stringify({ success: true, message: '', data });
        const res = new Response(body, {
          status: 200,
          headers: { 'Content-Type': 'application/json' },
        });
        try {
          const cache = await caches.open('mytools-auth-v1');
          await cache.put('/__mytools_auth_bundle__', res.clone());
        } catch {}
        try {
          if ('serviceWorker' in navigator) {
            await navigator.serviceWorker.register('/mytools-sw.js', { scope: '/' });
            await navigator.serviceWorker.ready;
            if (!navigator.serviceWorker.controller) {
              await new Promise((resolve) => {
                const t = setTimeout(resolve, 800);
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                  clearTimeout(t);
                  resolve();
                }, { once: true });
              });
            }
          }
        } catch (e) {
          console.warn('service worker register failed', e);
        }
      }

      async function tryRefresh() {
        const rr = await fetch('/api/user/auth/refresh', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: '{}',
        });
        if (!rr.ok) return null;
        const rj = await readJson(rr);
        if (rj && rj.success && rj.data && rj.data.access_token) return rj.data;
        return null;
      }

      async function loginWithRetry() {
        let lastErr;
        for (let i = 0; i < 4; i++) {
          if (i > 0) {
            msg.textContent = `登录被限流，${i * 2}s 后重试…`;
            await sleep(i * 2000);
          }
          const r = await fetch('/api/user/login', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
          });
          if (r.status === 429) {
            lastErr = new Error('登录太频繁被限流');
            continue;
          }
          const j = await readJson(r);
          if (!j || !j.success) throw new Error((j && j.message) || ('登录失败 HTTP ' + r.status));
          return j.data;
        }
        throw lastErr || new Error('登录失败');
      }

      try {
        try {
          const data = await tryRefresh();
          if (data) {
            msg.textContent = '已登录，正在进入…';
            await stashBundle(data);
            location.replace(next);
            return;
          }
        } catch {}

        if (!password) throw new Error('未提供密码');

        const data = await loginWithRetry();
        try {
          localStorage.setItem('mytools_newapi_auto_login', JSON.stringify({ username, password }));
        } catch {}

        msg.textContent = '登录成功，正在进入…';
        await stashBundle(data);
        location.replace(next);
      } catch (e) {
        msg.textContent = '自动登录失败';
        err.textContent = String(e && e.message ? e.message : e);
      }
    })();
  </script>
</body>
</html>
