<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New API 自动登录</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 14px/1.5 system-ui, sans-serif; color: #334155; background: #f8fafc;
    }
    .box { text-align: center; padding: 24px; }
    .err { color: #dc2626; margin-top: 8px; max-width: 420px; }
  </style>
</head>
<body>
  <div class="box">
    <div id="msg">正在自动登录…</div>
    <div id="err" class="err"></div>
  </div>
  <script>
    (async () => {
      const msg = document.getElementById('msg');
      const err = document.getElementById('err');
      const params = new URLSearchParams(location.search);
      const next = params.get('next') || '/console';

      let username = 'admin';
      let password = '';
      const hash = (location.hash || '').replace(/^#/, '');
      if (hash) {
        const i = hash.indexOf(':');
        if (i >= 0) {
          username = decodeURIComponent(hash.slice(0, i) || 'admin');
          password = decodeURIComponent(hash.slice(i + 1) || '');
        }
      }
      if (!password) {
        try {
          const j = JSON.parse(localStorage.getItem('mytools_newapi_auto_login') || '{}');
          username = j.username || username;
          password = j.password || '';
        } catch {}
      }

      async function stashBundle(data) {
        if (!data || !data.access_token) return;
        const body = JSON.stringify({ success: true, message: '', data });
        const res = new Response(body, {
          status: 200,
          headers: { 'Content-Type': 'application/json' },
        });
        try {
          const cache = await caches.open('mytools-auth-v1');
          await cache.put('/__mytools_auth_bundle__', res.clone());
        } catch {}
        try {
          if ('serviceWorker' in navigator) {
            const reg = await navigator.serviceWorker.register('/mytools-sw.js', { scope: '/' });
            await navigator.serviceWorker.ready;
            // 确保控制当前页后再跳转，否则首个 refresh 可能漏拦截
            if (!navigator.serviceWorker.controller) {
              await new Promise((resolve) => {
                const t = setTimeout(resolve, 800);
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                  clearTimeout(t);
                  resolve();
                }, { once: true });
              });
            }
            return reg;
          }
        } catch (e) {
          console.warn('service worker register failed', e);
        }
      }

      try {
        // 已有可用会话则直接进
        try {
          const rr = await fetch('/api/user/auth/refresh', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: '{}',
          });
          const rj = await rr.json();
          if (rj && rj.success && rj.data && rj.data.access_token) {
            msg.textContent = '已登录，正在进入…';
            await stashBundle(rj.data);
            location.replace(next);
            return;
          }
        } catch {}

        if (!password) throw new Error('未提供密码');

        const r = await fetch('/api/user/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const j = await r.json();
        if (!j || !j.success) throw new Error((j && j.message) || ('登录失败 HTTP ' + r.status));

        try {
          localStorage.setItem('mytools_newapi_auto_login', JSON.stringify({ username, password }));
        } catch {}

        msg.textContent = '登录成功，正在进入…';
        await stashBundle(j.data);
        location.replace(next);
      } catch (e) {
        msg.textContent = '自动登录失败';
        err.textContent = String(e && e.message ? e.message : e);
      }
    })();
  </script>
</body>
</html>
