# Ops-panel overlay (does NOT live in leidian repo).
# Extends local-build so gateway/task also COPY prebuilt JARs.
# Override `dockerfile` (not dockerfile_inline) so Compose merge
# replaces the upstream Dockerfile path instead of conflicting with it.

services:
  gateway-service:
    build:
      context: ${LEIDIAN_BACKEND_ROOT}
      dockerfile: ${OPS_LEIDIAN_OVERRIDES}/Dockerfile.gateway-service.local

  task-service:
    build:
      context: ${LEIDIAN_BACKEND_ROOT}
      dockerfile: ${OPS_LEIDIAN_OVERRIDES}/Dockerfile.task-service.local
