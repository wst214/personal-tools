# AnythingLLM for DevToolbox（本机 :3002 → 容器 :3001）
# 数据落在 ./storage；模型建议在 UI 里接本机 New API（host.docker.internal:5780）
# 项目名固定 mytools-stack，与仓库根 compose 同栈，避免 Docker Desktop 单独成组
name: mytools-stack

services:
  mytools-anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: mytools-anythingllm
    ports:
      - "3002:3001"
    cap_add:
      - SYS_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      STORAGE_DIR: /app/server/storage
      JWT_SECRET: mytools-anythingllm-local-dev-secret-change-me
      DISABLE_TELEMETRY: "true"
      # LLM: local New API (基元律动). Overridden by .env when present.
      LLM_PROVIDER: generic-openai
      GENERIC_OPEN_AI_BASE_PATH: http://host.docker.internal:5780/v1
      GENERIC_OPEN_AI_MODEL_PREF: deepseek-v4-flash-0731
      EMBEDDING_ENGINE: native
    volumes:
      - ./storage:/app/server/storage
      - ./.env:/app/server/.env
    restart: unless-stopped
