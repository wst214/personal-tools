<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>1 — 笔记/文档感 × 宽松</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; background:#faf9f6; color:#2b2a28; height:100vh; overflow:hidden; display:flex; }

/* 左侧窄栏：像 Notion 侧栏 */
.sidebar { width:230px; background:#f4f3ef; border-right:1px solid #e8e6e0; display:flex; flex-direction:column; padding:18px 12px; flex-shrink:0; }
.brand { display:flex; align-items:center; gap:9px; padding:4px 10px 16px; font-weight:700; font-size:14px; color:#1f1e1b; }
.brand .logo { width:24px; height:24px; border-radius:7px; background:linear-gradient(135deg,#4a9d5f,#2e7d46); display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; }
.sb-search { display:flex; align-items:center; gap:8px; background:#fff; border:1px solid #e2dfd7; border-radius:8px; padding:7px 11px; margin-bottom:12px; color:#a09d94; font-size:12px; }
.sb-section { font-size:10.5px; font-weight:600; color:#a09d94; letter-spacing:.04em; padding:12px 10px 5px; }
.sb-item { display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:7px; font-size:13px; color:#5b594f; cursor:pointer; }
.sb-item:hover { background:#eae8e1; color:#1f1e1b; }
.sb-item.active { background:#fff; color:#2e7d46; font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.05); }
.sb-foot { margin-top:auto; padding:10px; font-size:11px; color:#a09d94; }

/* 主区：像文档 */
.main { flex:1; overflow:auto; padding:48px 56px 80px; }
.breadcrumb { font-size:12px; color:#a09d94; margin-bottom:14px; }
.doc-title { font-size:30px; font-weight:700; color:#1f1e1b; letter-spacing:-.01em; margin-bottom:6px; }
.doc-sub { font-size:13px; color:#8a867b; margin-bottom:32px; }
.doc-block { background:#fff; border:1px solid #e8e6e0; border-radius:12px; padding:28px 32px; margin-bottom:18px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
.doc-block h3 { font-size:15px; font-weight:600; color:#1f1e1b; margin-bottom:14px; }
.doc-row { display:flex; gap:10px; margin-bottom:10px; }
.doc-row:last-child { margin-bottom:0; }
.doc-input { flex:1; background:#faf9f6; border:1px solid #e2dfd7; border-radius:8px; padding:9px 13px; font-size:13px; color:#2b2a28; }
.doc-input:focus { outline:none; border-color:#4a9d5f; background:#fff; }
.doc-btn { background:#fff; border:1px solid #e2dfd7; border-radius:8px; padding:8px 15px; font-size:12.5px; color:#5b594f; cursor:pointer; }
.doc-btn:hover { border-color:#4a9d5f; color:#2e7d46; }
.doc-btn.primary { background:#2e7d46; border-color:#2e7d46; color:#fff; }
.doc-btn.primary:hover { background:#265f38; }
.doc-hint { font-size:11.5px; color:#a09d94; margin-top:6px; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="brand"><div class="logo">◈</div><span>DevTool</span></div>
  <div class="sb-search">⌕ 搜索…</div>
  <div class="sb-section">工作区</div>
  <div class="sb-item active">📝 随手记</div>
  <div class="sb-item">⭐ 常用</div>
  <div class="sb-section">工具</div>
  <div class="sb-item">{} JSON 格式化</div>
  <div class="sb-item">🔐 加解密编码</div>
  <div class="sb-item">SQL 格式化</div>
  <div class="sb-item">.* 正则测试</div>
  <div class="sb-section">连接</div>
  <div class="sb-item">⌁ SSH 终端</div>
  <div class="sb-item">⇄ HTTP 工具</div>
  <div class="sb-foot">DevTool v0.1 · 本地</div>
</div>

<div class="main">
  <div class="breadcrumb">工具 / 编码转换</div>
  <div class="doc-title">JSON 格式化</div>
  <div class="doc-sub">格式化 / 压缩 / 转换 / 折叠浏览</div>

  <div class="doc-block">
    <h3>输入</h3>
    <div class="doc-row">
      <div class="doc-input" style="min-height:140px; display:flex; align-items:flex-start;">在此粘贴 JSON…</div>
    </div>
    <div class="doc-hint">支持粘贴 10MB+ 大文件，后台线程处理不卡界面</div>
  </div>

  <div class="doc-block">
    <h3>操作</h3>
    <div class="doc-row">
      <div class="doc-btn primary">缩进 2 空格</div>
      <div class="doc-btn">缩进 4 空格</div>
      <div class="doc-btn">压缩</div>
      <div class="doc-btn">转义</div>
      <div class="doc-btn">折叠视图</div>
    </div>
  </div>

  <div class="doc-block">
    <h3>结果</h3>
    <div class="doc-row">
      <div class="doc-input" style="min-height:140px; display:flex; align-items:flex-start;">格式化结果将显示在这里…</div>
    </div>
  </div>
</div>
</body>
</html>
