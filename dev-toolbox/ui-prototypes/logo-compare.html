<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>主图标（Logo）方案对比</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; background:#faf7f0; color:#3d342a; padding:34px 40px; }
h1 { font-size:20px; margin-bottom:6px; }
.sub { color:#8d8172; font-size:12.5px; margin-bottom:30px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:22px; }
.opt { background:#fffdf8; border:1px solid #ece4d6; border-radius:16px; padding:26px 20px; text-align:center; cursor:pointer; transition:all .15s; }
.opt:hover { border-color:#d97706; box-shadow:0 8px 24px rgba(90,60,20,.08); transform:translateY(-2px); }
.opt.selected { border-color:#d97706; box-shadow:0 0 0 2px #d97706; }
.opt .logo { width:88px; height:88px; margin:6px auto 16px; }
.opt .name { font-size:14px; font-weight:700; }
.opt .desc { font-size:11.5px; color:#8d8172; margin-top:6px; line-height:1.6; }
.opt .tag { display:inline-block; font-size:10px; color:#d97706; background:#fdf0dc; border-radius:4px; padding:2px 7px; margin-top:10px; }
.badge-row { display:flex; justify-content:center; gap:8px; margin-top:16px; }
.badge { font-size:10px; color:#8d8172; border:1px solid #ece4d6; border-radius:10px; padding:3px 9px; }
</style>
</head>
<body>
<h1>主图标方案</h1>
<div class="sub">4 套 logo 设计，跟「彩色圆角方块」UI 风格统一。点卡片选中，看下角标实时更新</div>

<div class="grid" id="grid">
  <!-- A: 工具箱 -->
  <div class="opt" onclick="pick(this,'A')">
    <div class="logo">
      <svg viewBox="0 0 96 96" width="88" height="88">
        <defs>
          <linearGradient id="ga" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ea580c"/>
          </linearGradient>
        </defs>
        <rect x="4" y="4" width="88" height="88" rx="22" fill="url(#ga)"/>
        <rect x="4" y="4" width="88" height="88" rx="22" fill="none" stroke="#fff" stroke-opacity=".2"/>
        <!-- 工具箱：把手 + 箱体 -->
        <path d="M32 34h32l-3 8H35z" fill="#fff" opacity=".95"/>
        <rect x="30" y="40" width="36" height="26" rx="4" fill="#fff"/>
        <path d="M43 40v26M53 40v26" stroke="#ea580c" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="name">工具箱</div>
    <div class="desc">橙色工具箱，暗喻"开发者工具箱"，直接表达产品</div>
    <div class="tag">推荐 · 语义直白</div>
  </div>

  <!-- B: 四色方块 -->
  <div class="opt" onclick="pick(this,'B')">
    <div class="logo">
      <svg viewBox="0 0 96 96" width="88" height="88">
        <defs>
          <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1f2937"/><stop offset="1" stop-color="#111827"/>
          </linearGradient>
        </defs>
        <rect x="4" y="4" width="88" height="88" rx="22" fill="url(#gb)"/>
        <!-- 四色圆角方块：代表多功能 -->
        <rect x="22" y="22" width="24" height="24" rx="7" fill="#f59e0b"/>
        <rect x="50" y="22" width="24" height="24" rx="7" fill="#6366f1"/>
        <rect x="22" y="50" width="24" height="24" rx="7" fill="#10b981"/>
        <rect x="50" y="50" width="24" height="24" rx="7" fill="#ec4899"/>
      </svg>
    </div>
    <div class="name">四色模块</div>
    <div class="desc">深底 + 四色圆角方块（橙/蓝/绿/粉），呼应工具图标的多彩语言</div>
    <div class="tag">多彩 · 现代</div>
  </div>

  <!-- C: 终端括号 -->
  <div class="opt" onclick="pick(this,'C')">
    <div class="logo">
      <svg viewBox="0 0 96 96" width="88" height="88">
        <defs>
          <linearGradient id="gc" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/>
          </linearGradient>
        </defs>
        <rect x="4" y="4" width="88" height="88" rx="22" fill="url(#gc)"/>
        <path d="M38 30 24 48l14 18M58 30l14 18-14 18" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M52 26 44 70" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="name">终端括号</div>
    <div class="desc">代码括号 &lt;/&gt;，开发者语言，蓝紫渐变呼应 JSON 图标</div>
    <div class="tag">极客 · 简洁</div>
  </div>

  <!-- D: 青绿对勾 -->
  <div class="opt" onclick="pick(this,'D')">
    <div class="logo">
      <svg viewBox="0 0 96 96" width="88" height="88">
        <defs>
          <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#0d9488"/>
          </linearGradient>
        </defs>
        <rect x="4" y="4" width="88" height="88" rx="22" fill="url(#gd)"/>
        <path d="M30 48l13 13 25-30" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="name">青绿对勾</div>
    <div class="desc">青绿底 + 白色对勾，简洁、完成感，呼应薄荷主题</div>
    <div class="tag">极简 · 清新</div>
  </div>
</div>

<div class="badge-row">
  <span class="badge">已选：<b id="picked">工具箱（A）</b></span>
</div>

<script>
function pick(el, id){
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected');
  const names = {A:'工具箱（A）',B:'四色模块（B）',C:'终端括号（C）',D:'青绿对勾（D）'};
  document.getElementById('picked').textContent = names[id];
}
</script>
</body>
</html>
