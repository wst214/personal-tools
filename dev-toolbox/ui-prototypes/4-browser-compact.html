<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>4 — 浏览器感 × 紧凑</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; background:#f0f1f4; color:#1d2026; height:100vh; overflow:hidden; display:flex; flex-direction:column; }

/* 顶栏：Chrome 式地址栏 + 紧凑标签 */
.topbar { display:flex; align-items:center; gap:8px; padding:7px 12px; background:#fff; border-bottom:1px solid #e4e7ec; flex-shrink:0; }
.topbar .logo { width:20px; height:20px; border-radius:6px; background:linear-gradient(135deg,#4f7cff,#7c4dff); display:flex; align-items:center; justify-content:center; font-size:10px; color:#fff; flex-shrink:0; }
.tabs { display:flex; align-items:center; gap:2px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none; }
.tab { display:flex; align-items:center; gap:5px; padding:4px 10px; border-radius:6px; font-size:11.5px; color:#6b7180; cursor:pointer; white-space:nowrap; }
.tab:hover { background:#f0f1f4; }
.tab.active { background:#f0f1f4; color:#1d2026; font-weight:600; }
.tab .x { color:#9aa0ad; font-size:11px; margin-left:2px; }
.tab .x:hover { color:#e04f4f; }
.omni { display:flex; align-items:center; gap:7px; background:#f2f3f7; border:1px solid #e4e7ec; border-radius:7px; padding:5px 12px; width:260px; color:#9aa0ad; font-size:11.5px; flex-shrink:0; }
.omni input { flex:1; border:none; background:transparent; outline:none; font-size:11.5px; color:#1d2026; }

/* 中部：窄侧栏 + 内容 */
.mid { flex:1; display:flex; min-height:0; }
.side { width:150px; background:#f7f8fa; border-right:1px solid #e4e7ec; overflow-y:auto; padding:8px 6px; flex-shrink:0; }
.side .grp { font-size:9.5px; font-weight:600; color:#9aa0ad; padding:8px 8px 3px; }
.side .item { display:flex; align-items:center; gap:6px; padding:4px 8px; border-radius:5px; font-size:11.5px; color:#4b5261; cursor:pointer; white-space:nowrap; }
.side .item:hover { background:#eceef2; }
.side .item.active { background:#e8edff; color:#3d68e0; font-weight:600; }

.content { flex:1; overflow:auto; padding:12px; }
.pane { background:#fff; border:1px solid #e4e7ec; border-radius:8px; margin-bottom:10px; overflow:hidden; }
.pane-head { display:flex; align-items:center; gap:6px; padding:6px 11px; background:#fafbfc; border-bottom:1px solid #eef0f3; font-size:11px; font-weight:600; color:#6b7180; }
.pane-body { padding:10px; }
.area { background:#f7f8fb; border:1px solid #eceef2; border-radius:6px; min-height:80px; padding:10px; color:#b0b6c2; font-size:12px; }
.toolbar { display:flex; gap:5px; padding:8px 10px; border-top:1px solid #eef0f3; background:#fafbfc; flex-wrap:wrap; }
.btn { border:1px solid #e4e7ec; background:#fff; border-radius:5px; padding:4px 10px; font-size:11px; color:#4b5261; cursor:pointer; }
.btn:hover { border-color:#4f7cff; color:#4f7cff; }
.btn.primary { background:#4f7cff; border-color:#4f7cff; color:#fff; }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">◈</div>
  <div class="tabs">
    <div class="tab">📝 随手记</div>
    <div class="tab active">{} JSON <span class="x">×</span></div>
    <div class="tab">🔐 加解密 <span class="x">×</span></div>
    <div class="tab">SQL 格式化 <span class="x">×</span></div>
  </div>
  <div class="omni"><span>⌕</span><input placeholder="搜索工具…"></div>
</div>

<div class="mid">
  <div class="side">
    <div class="grp">常用</div>
    <div class="item">📝 随手记</div>
    <div class="item active">{} JSON</div>
    <div class="grp">编码转换</div>
    <div class="item">🔐 加解密</div>
    <div class="item">2⁸ 进制</div>
    <div class="item">⏱ 时间戳</div>
    <div class="grp">文本</div>
    <div class="item">SQL</div>
    <div class="item">.* 正则</div>
  </div>
  <div class="content">
    <div class="pane">
      <div class="pane-head">输入</div>
      <div class="pane-body"><div class="area">在此粘贴 JSON…</div></div>
    </div>
    <div class="pane">
      <div class="pane-head">结果</div>
      <div class="pane-body"><div class="area">结果…</div></div>
      <div class="toolbar">
        <div class="btn primary">缩进 2 空格</div>
        <div class="btn">缩进 4 空格</div>
        <div class="btn">压缩</div>
        <div class="btn">转义</div>
        <div class="btn">折叠视图</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
