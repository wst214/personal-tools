<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>5 — macOS 系统感 × 宽松（配色可切换）</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; height:100vh; overflow:hidden; display:flex; }
svg { display:block; }

/* ===== 4 套配色（CSS 变量） ===== */
:root, [data-theme="2"] { /* ② 暖木米色（默认） */
  --bg:#f7f3ec; --side:#faf7f0; --card:#fffdf8; --border:#ece4d6; --border2:#e3d9c8;
  --text:#3d342a; --dim:#8d8172; --accent:#d97706; --accentSoft:#fdf0dc; --hover:#f1ead9;
  --shadow:0 1px 3px rgba(90,60,20,.08); --shadowCard:0 2px 6px rgba(90,60,20,.06);
}
[data-theme="1"] { /* ① 清爽蓝白 */
  --bg:#eef2f7; --side:#f8fafc; --card:#ffffff; --border:#e2e8f0; --border2:#dbe3ee;
  --text:#1e293b; --dim:#64748b; --accent:#2563eb; --accentSoft:#e8f0fe; --hover:#e6edf6;
  --shadow:0 1px 3px rgba(30,60,110,.08); --shadowCard:0 2px 6px rgba(30,60,110,.06);
}
[data-theme="3"] { /* ③ 冷灰科技 */
  --bg:#e9ecf1; --side:#f4f6f9; --card:#ffffff; --border:#d9dee8; --border2:#cdd4e0;
  --text:#1f2937; --dim:#6b7280; --accent:#4f46e5; --accentSoft:#e9e8fd; --hover:#e7ebf2;
  --shadow:0 1px 3px rgba(30,40,60,.10); --shadowCard:0 2px 6px rgba(30,40,60,.07);
}
[data-theme="4"] { /* ④ 薄荷青绿 */
  --bg:#eef6f2; --side:#f6faf8; --card:#ffffff; --border:#dcebe4; --border2:#cfe3da;
  --text:#173b2c; --dim:#5f7a6d; --accent:#0d9488; --accentSoft:#e0f5f2; --hover:#e3f0ea;
  --shadow:0 1px 3px rgba(20,80,60,.08); --shadowCard:0 2px 6px rgba(20,80,60,.06);
}

body { background:var(--bg); color:var(--text); }

/* ===== 左侧 ===== */
.sidebar { width:240px; background:var(--side); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:22px 12px; flex-shrink:0; }
.sb-brand { display:flex; align-items:center; gap:9px; padding:2px 10px 14px; font-weight:700; font-size:14px; color:var(--text); }
.sb-brand .logo { width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,#f59e0b,#ea580c); display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; box-shadow:var(--shadowCard); }
.sb-search { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:8px 12px; margin-bottom:14px; color:var(--dim); font-size:13px; }
.sb-grp { font-size:11px; font-weight:600; color:var(--dim); padding:10px 10px 5px; opacity:.8; }
.sb-item { display:flex; align-items:center; gap:11px; padding:7px 10px; border-radius:8px; font-size:13px; color:var(--text); cursor:pointer; }
.sb-item:hover { background:var(--hover); }
.sb-item.active { background:var(--card); box-shadow:var(--shadow); color:var(--accent); font-weight:600; }
.sb-item .ic { width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; box-shadow:0 1px 2px rgba(0,0,0,.10); }
.sb-item .ic svg { width:15px; height:15px; }
/* 工具专属渐变色 */
.ic-note{background:linear-gradient(135deg,#f59e0b,#f97316)} .ic-json{background:linear-gradient(135deg,#6366f1,#4f46e5)}
.ic-lock{background:linear-gradient(135deg,#0e9f6e,#059669)} .ic-base{background:linear-gradient(135deg,#06b6d4,#0891b2)}
.ic-time{background:linear-gradient(135deg,#ec4899,#db2777)} .ic-sql{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
.ic-regex{background:linear-gradient(135deg,#f43f5e,#e11d48)} .ic-ssh{background:linear-gradient(135deg,#10b981,#059669)}
.ic-http{background:linear-gradient(135deg,#3b82f6,#2563eb)} .ic-deploy{background:linear-gradient(135deg,#f97316,#ea580c)}
.ic-sys{background:linear-gradient(135deg,#64748b,#475569)} .ic-indent{background:linear-gradient(135deg,#6366f1,#4f46e5)}
.ic-compress{background:linear-gradient(135deg,#f59e0b,#f97316)} .ic-tree{background:linear-gradient(135deg,#10b981,#059669)}
.ic-in{background:linear-gradient(135deg,#3b82f6,#2563eb)} .ic-out{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}

/* ===== 右侧 ===== */
.main { flex:1; overflow:auto; padding:36px 42px; }
.page-top { display:flex; align-items:center; gap:14px; margin-bottom:6px; }
.page-title { font-size:26px; font-weight:700; letter-spacing:-.01em; }
.page-sub { font-size:13px; color:var(--dim); margin-bottom:26px; }
.section { margin-bottom:28px; }
.section-title { font-size:14px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.section-title .count { font-size:11px; color:var(--dim); font-weight:400; }
.big-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:13px; }
.big-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 16px; display:flex; flex-direction:column; gap:11px; cursor:pointer; transition:all .15s; box-shadow:var(--shadowCard); }
.big-card:hover { border-color:var(--accent); box-shadow:0 8px 22px rgba(0,0,0,.08); }
.big-card .ic { width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 2px 6px rgba(0,0,0,.10); }
.big-card .ic svg { width:21px; height:21px; }
.big-card .nm { font-size:14px; font-weight:600; }
.big-card .ds { font-size:11.5px; color:var(--dim); line-height:1.5; }
.row-card { display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 18px; margin-bottom:10px; cursor:pointer; box-shadow:var(--shadowCard); }
.row-card:hover { border-color:var(--accent); }
.row-card .ic { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; box-shadow:0 1px 3px rgba(0,0,0,.10); }
.row-card .ic svg { width:17px; height:17px; }
.row-card .nm { font-size:13.5px; font-weight:600; }
.row-card .ds { font-size:11.5px; color:var(--dim); margin-top:2px; }
.row-card .arrow { margin-left:auto; color:var(--dim); font-size:16px; }

/* ===== 配色切换器 ===== */
.theme-switch { position:fixed; top:16px; right:18px; display:flex; gap:4px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:4px; box-shadow:var(--shadow); z-index:10; }
.theme-switch button { width:26px; height:26px; border-radius:7px; border:1px solid transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--dim); background:transparent; }
.theme-switch button:hover { background:var(--hover); }
.theme-switch button.active { border-color:var(--accent); color:var(--accent); background:var(--accentSoft); font-weight:700; }
.logo-switch { position:fixed; top:52px; right:18px; display:flex; flex-wrap:wrap; gap:4px; max-width:120px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:4px; box-shadow:var(--shadow); z-index:10; }
.logo-switch button { width:26px; height:26px; border-radius:7px; border:1px solid transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--dim); background:transparent; }
.logo-switch button:hover { background:var(--hover); }
.logo-switch button.active { border-color:var(--accent); color:var(--accent); background:var(--accentSoft); font-weight:700; }
/* 主图标容器 */
#brand-logo { width:30px; height:30px; border-radius:8px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
#brand-logo svg { width:100%; height:100%; display:block; }
</style>
</head>
<body data-theme="2">
<!-- 配色切换器 -->
<div class="theme-switch" title="切换配色">
  <button data-t="1" onclick="setTheme(1)">①</button>
  <button data-t="2" class="active" onclick="setTheme(2)">②</button>
  <button data-t="3" onclick="setTheme(3)">③</button>
  <button data-t="4" onclick="setTheme(4)">④</button>
</div>

<!-- 主图标切换器 -->
<div class="logo-switch" title="切换主图标">
  <button data-l="A" class="active" onclick="setLogo('A')">A</button>
  <button data-l="B" onclick="setLogo('B')">B</button>
  <button data-l="C" onclick="setLogo('C')">C</button>
  <button data-l="D" onclick="setLogo('D')">D</button>
  <button data-l="E" onclick="setLogo('E')">E</button>
  <button data-l="F" onclick="setLogo('F')">F</button>
  <button data-l="G" onclick="setLogo('G')">G</button>
  <button data-l="H" onclick="setLogo('H')">H</button>
  <button data-l="I" onclick="setLogo('I')">I</button>
  <button data-l="J" onclick="setLogo('J')">J</button>
</div>

  const el = document.getElementById('brand-logo');
