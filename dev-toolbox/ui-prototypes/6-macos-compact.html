<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>6 — macOS 系统感 × 紧凑</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; background:#fff; color:#1d1d1f; height:100vh; overflow:hidden; display:flex; flex-direction:column; }

/* 顶部：访达式工具栏 */
.topbar { display:flex; align-items:center; gap:10px; padding:8px 14px; background:#f7f7f9; border-bottom:1px solid #e3e3e8; flex-shrink:0; }
.nav-arrow { width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center; color:#86868b; cursor:pointer; }
.nav-arrow:hover { background:#e9e9ed; }
.nav-arrow.disabled { opacity:.35; }
.title { font-size:13px; font-weight:600; flex:1; }
.omni { display:flex; align-items:center; gap:7px; background:#fff; border:1px solid #e3e3e8; border-radius:7px; padding:5px 11px; width:240px; color:#86868b; font-size:12px; }
.omni input { flex:1; border:none; outline:none; font-size:12px; }

/* 三栏 */
.body { flex:1; display:flex; min-height:0; }
.col1 { width:150px; background:#f7f7f9; border-right:1px solid #e3e3e8; padding:10px 8px; overflow-y:auto; flex-shrink:0; }
.col1 .item { display:flex; align-items:center; gap:7px; padding:5px 9px; border-radius:6px; font-size:12px; color:#4a4a50; cursor:pointer; }
.col1 .item:hover { background:#ececef; }
.col1 .item.active { background:#dbe9ff; color:#0071e3; font-weight:600; }

.col2 { width:190px; background:#fff; border-right:1px solid #e3e3e8; padding:10px 8px; overflow-y:auto; flex-shrink:0; }
.col2 .grp { font-size:9.5px; font-weight:600; color:#86868b; padding:8px 8px 3px; }
.col2 .item { display:flex; align-items:center; gap:6px; padding:4px 8px; border-radius:5px; font-size:11.5px; color:#4a4a50; cursor:pointer; white-space:nowrap; }
.col2 .item:hover { background:#f2f2f5; }
.col2 .item.active { background:#e8f0fe; color:#0071e3; font-weight:600; }

.col3 { flex:1; padding:14px; overflow:auto; background:#fff; }
.detail-title { font-size:17px; font-weight:700; margin-bottom:4px; }
.detail-sub { font-size:11.5px; color:#86868b; margin-bottom:14px; }
.field { margin-bottom:10px; }
.field .label { font-size:10.5px; font-weight:600; color:#86868b; margin-bottom:4px; }
.field .input { background:#f7f7f9; border:1px solid #e3e3e8; border-radius:6px; padding:7px 10px; font-size:12.5px; min-height:60px; }
.btn-row { display:flex; gap:6px; margin-top:12px; }
.btn { border:1px solid #d9d9de; background:#fff; border-radius:6px; padding:5px 12px; font-size:11.5px; color:#4a4a50; cursor:pointer; }
.btn:hover { background:#f2f2f5; }
.btn.primary { background:#0071e3; border-color:#0071e3; color:#fff; }
.btn.primary:hover { background:#0062c4; }
</style>
</head>
<body>
<div class="topbar">
  <div class="nav-arrow disabled">‹</div>
  <div class="nav-arrow">›</div>
  <div class="title">DevTool</div>
  <div class="omni"><span>⌕</span><input placeholder="搜索工具…"></div>
</div>

<div class="body">
  <div class="col1">
    <div class="item active">📚 工具</div>
    <div class="item">⭐ 常用</div>
    <div class="item">🗄 最近</div>
  </div>
  <div class="col2">
    <div class="grp">编码转换</div>
    <div class="item active">{} JSON 格式化</div>
    <div class="item">🔐 加解密</div>
    <div class="item">2⁸ 进制</div>
    <div class="item">⏱ 时间戳</div>
    <div class="grp">文本</div>
    <div class="item">SQL 格式化</div>
    <div class="item">.* 正则</div>
    <div class="grp">网络</div>
    <div class="item">⌁ SSH</div>
    <div class="item">⇄ HTTP</div>
  </div>
  <div class="col3">
    <div class="detail-title">JSON 格式化</div>
    <div class="detail-sub">格式化 / 压缩 / 转换 / 折叠浏览</div>
    <div class="field"><div class="label">输入</div><div class="input">在此粘贴 JSON…</div></div>
    <div class="field"><div class="label">输出</div><div class="input">结果…</div></div>
    <div class="btn-row">
      <div class="btn primary">缩进 2 空格</div>
      <div class="btn">缩进 4 空格</div>
      <div class="btn">压缩</div>
      <div class="btn">折叠视图</div>
    </div>
  </div>
</div>
</body>
</html>
