id: wn-10-dispatch-on-active
name: 无需确认的 ACTIVE 事件应投递通知
description: 【暂不执行】验收：无需确认的 ACTIVE 事件应投递通知。
skip: true
skipReason: 能力未上线；本用例按验收标准编写，上线后取消 skip 即可跑
steps:
- method: POST
  service: biz
  path: /warning/rules
  expect:
    status: 200
    fields:
      code: 0
  body:
    ruleName: 验收-直发通知-${rand}
    siteId: 1
    conditionJson: '{"logic":"AND","groups":[{"logic":"AND","conditions":[{"factor":"ATMO_EFIELD_INSTANT","op":"GT","value":1}]}]}'
    actionJson: '{"actionType":"WARNING","warningLevel":"BLUE","needConfirm":false}'
    scheduleType: ALWAYS
  capture:
    ruleId: data.id
- method: POST
  service: biz
  path: /warning/rules/${ruleId}/submit
  expect:
    status: 200
    fields:
      code: 0
- method: POST
  service: biz
  path: /warning/eval/trigger
  expect:
    status: 200
    fields:
      code: 0
  body:
    siteId: 1
    factors:
      ATMO_EFIELD_INSTANT: 9
- method: GET
  service: biz
  path: /warning/events?pageNum=1&pageSize=1&keyword=验收-直发通知
  expect:
    status: 200
    fields:
      code: 0
  capture:
    eventId: data.list.0.id
- method: GET
  service: biz
  path: /warning/notify/records?eventId=${eventId}
  expect:
    status: 200
    fields:
      code: 0
