id: wn-01-confirm-task-created
name: 需确认命中应产生确认任务
description: 【暂不执行】验收：需确认规则应生成确认任务。
skip: true
skipReason: 能力未上线；本用例按验收标准编写，上线后取消 skip 即可跑
steps:
- method: POST
  service: biz
  path: /warning/rules
  expect:
    status: 200
    fields:
      code: 0
  body:
    ruleName: 验收-确认任务-${rand}
    siteId: 1
    conditionJson: '{"logic":"AND","groups":[{"logic":"AND","conditions":[{"factor":"ATMO_EFIELD_INSTANT","op":"GT","value":1}]}]}'
    actionJson: '{"actionType":"WARNING","warningLevel":"YELLOW","needConfirm":true}'
    scheduleType: ALWAYS
  capture:
    ruleId: data.id
- method: POST
  service: biz
  path: /warning/rules/${ruleId}/submit
  expect:
    status: 200
    fields:
      code: 0
- method: POST
  service: biz
  path: /warning/eval/trigger
  expect:
    status: 200
    fields:
      code: 0
  body:
    siteId: 1
    factors:
      ATMO_EFIELD_INSTANT: 9
- method: GET
  service: biz
  path: /warning/notify/tasks?pageNum=1&pageSize=10&status=PENDING
  expect:
    status: 200
    fields:
      code: 0
