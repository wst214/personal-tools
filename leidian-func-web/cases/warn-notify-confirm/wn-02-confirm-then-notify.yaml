id: wn-02-confirm-then-notify
name: 确认通过后事件 ACTIVE 并投递通知
description: 【暂不执行】验收：确认通过后事件 ACTIVE 并投递通知。
skip: true
skipReason: 能力未上线；本用例按验收标准编写，上线后取消 skip 即可跑
steps:
- method: GET
  service: biz
  path: /warning/events?pageNum=1&pageSize=1&lifecycleStatus=PENDING_CONFIRM
  expect:
    status: 200
    fields:
      code: 0
  capture:
    eventId: data.list.0.id
- method: POST
  service: biz
  path: /warning/events/${eventId}/confirm
  expect:
    status: 200
    fields:
      code: 0
      data.lifecycleStatus: ACTIVE
  body:
    decision: APPROVE
- method: GET
  service: biz
  path: /warning/notify/records?eventId=${eventId}
  expect:
    status: 200
    fields:
      code: 0
