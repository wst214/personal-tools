id: wr-08-disable
name: 停用已启用规则
description: 对已启用规则执行停用，期望状态变为 DISABLED。
skip: true
skipReason: 预警相关代码已移除；整包用例跳过
steps:
- method: POST
  service: biz
  path: /warning/rules
  body:
    ruleName: 功能测-停用-${rand}
    conditionJson: '{}'
    actionJson: '{"actionType":"WARNING","warningLevel":"YELLOW"}'
    scheduleType: ALWAYS
  expect:
    status: 200
    fields:
      code: 0
  capture:
    ruleId: data.id
- method: POST
  service: biz
  path: /warning/rules/${ruleId}/submit
  expect:
    status: 200
    fields:
      code: 0
      data.ruleStatus: ENABLED
- method: POST
  service: biz
  path: /warning/rules/${ruleId}/disable
  expect:
    status: 200
    fields:
      code: 0
      data.ruleStatus: DISABLED
      data.versionStatus: ACTIVE
