id: wg-13-device-only-match
name: 仅设备抑制：纯气象命中不被误压
description: 验收：仅 DEVICE 目标的 FULL 抑制 -> override 命中无设备交集 -> 不抑制，事件正常 ACTIVE。
skip: false
skipReason: ''
steps:
- method: POST
  service: biz
  path: /warning/suppress
  body:
    siteId: 1000000000000050101
    suppressName: 验收-设备抑制-${rand}
    reason: WG-13
    suppressScope: FULL
    timeMode: PERMANENT
    targets:
    - targetType: DEVICE
      targetId: 9001
      targetCode: DEV-9001
  expect:
    status: 200
    fields:
      code: 0
      data.suppressStatus: DRAFT
      data.targetMode: DEVICE
  capture:
    suppressId: data.id
- method: POST
  service: biz
  path: /warning/suppress/${suppressId}/submit
  expect:
    status: 200
    fields:
      code: 0
      data.suppressStatus: ACTIVE
- method: POST
  service: biz
  path: /warning/rules
  body:
    ruleName: 验收-纯气象-${rand}
    ruleDesc: WG-13
    conditionJson: '{"logic":"AND","children":[{"factorCode":"ATMO_EFIELD_INSTANT","op":"GTE","value":5}]}'
    actionJson: '{"actionType":"WARNING","warningLevel":"BLUE","notify":{"requireConfirm":false}}'
    foreseeMinutes: 60
    scheduleType: ALWAYS
  expect:
    status: 200
    fields:
      code: 0
      data.ruleStatus: DRAFT
  capture:
    ruleId: data.id
- method: POST
  service: biz
  path: /warning/rules/${ruleId}/submit
  expect:
    status: 200
    fields:
      code: 0
      data.ruleStatus: ENABLED
- method: POST
  service: biz
  path: /warning/eval/trigger
  body:
    siteId: 1000000000000050101
    ruleId: ${ruleId}
    factorOverrides:
      ATMO_EFIELD_INSTANT: 9
  expect:
    status: 200
    fields:
      code: 0
      data.candidates.0.warningLevel: BLUE
- method: GET
  service: biz
  path: /warning/events?pageNum=1&pageSize=1&siteId=1000000000000050101&lifecycleStatus=ACTIVE&warningLevel=BLUE
  expect:
    status: 200
    fields:
      code: 0
      data.list.0.lifecycleStatus: ACTIVE
