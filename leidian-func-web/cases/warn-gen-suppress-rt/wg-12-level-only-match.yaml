id: wg-12-level-only-match
name: 仅等级目标按等级匹配触发 FULL 抑制
description: 验收：仅配置 WARNING_LEVEL 目标 -> 等级命中即 FULL 抑制，SUPPRESSED 事件。
skip: false
skipReason: ''
steps:
- method: POST
  service: biz
  path: /warning/suppress
  body:
    siteId: 1000000000000050101
    suppressName: 验收-等级抑制-${rand}
    reason: WG-12
    suppressScope: FULL
    timeMode: PERMANENT
    targets:
    - targetType: WARNING_LEVEL
      targetCode: RED
  expect:
    status: 200
    fields:
      code: 0
      data.suppressStatus: DRAFT
  capture:
    suppressId: data.id
- method: POST
  service: biz
  path: /warning/suppress/${suppressId}/submit
  expect:
    status: 200
    fields:
      code: 0
      data.suppressStatus: ACTIVE
- method: POST
  service: biz
  path: /warning/rules
  body:
    ruleName: 验收-红级规则-${rand}
    ruleDesc: WG-12
    conditionJson: '{"logic":"AND","children":[{"factorCode":"ATMO_EFIELD_INSTANT","op":"GTE","value":5}]}'
    actionJson: '{"actionType":"WARNING","warningLevel":"RED","notify":{"requireConfirm":false}}'
    foreseeMinutes: 60
    scheduleType: ALWAYS
  expect:
    status: 200
    fields:
      code: 0
      data.ruleStatus: DRAFT
  capture:
    ruleId: data.id
- method: POST
  service: biz
  path: /warning/rules/${ruleId}/submit
  expect:
    status: 200
    fields:
      code: 0
      data.ruleStatus: ENABLED
- method: POST
  service: biz
  path: /warning/eval/trigger
  body:
    siteId: 1000000000000050101
    ruleId: ${ruleId}
    factorOverrides:
      ATMO_EFIELD_INSTANT: 9
  expect:
    status: 200
    fields:
      code: 0
      data.candidates.0.warningLevel: RED
- method: GET
  service: biz
  path: /warning/events?pageNum=1&pageSize=1&siteId=1000000000000050101&lifecycleStatus=SUPPRESSED&includeHidden=true
  expect:
    status: 200
    fields:
      code: 0
      data.list.0.lifecycleStatus: SUPPRESSED
      data.list.0.suppressId: ${suppressId}
