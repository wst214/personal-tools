id: wg-11-notify-only-flag
name: NOTIFY_ONLY 仍归并事件但标记不通知
description: 验收：NOTIFY_ONLY 抑制（等级匹配）-> 事件归并为 ACTIVE，notifySuppressed=1。
skip: true
skipReason: 预警相关代码已移除；整包用例跳过
steps:
- method: POST
  service: biz
  path: /warning/rules
  body:
    ruleName: 验收-仅通知抑制规则-${rand}
    ruleDesc: WG-11
    conditionJson: '{"logic":"AND","children":[{"factorCode":"ATMO_EFIELD_INSTANT","op":"GTE","value":5}]}'
    actionJson: '{"actionType":"WARNING","warningLevel":"ORANGE","notify":{"requireConfirm":false}}'
    foreseeMinutes: 60
    scheduleType: ALWAYS
  expect:
    status: 200
    fields:
      code: 0
      data.ruleStatus: DRAFT
  capture:
    ruleId: data.id
- method: POST
  service: biz
  path: /warning/rules/${ruleId}/submit
  expect:
    status: 200
    fields:
      code: 0
      data.ruleStatus: ENABLED
- method: POST
  service: biz
  path: /warning/suppress
  body:
    siteId: 1000000000000050101
    suppressName: 验收-NOTIFY_ONLY-${rand}
    reason: WG-11
    suppressScope: NOTIFY_ONLY
    timeMode: PERMANENT
    targets:
    - targetType: WARNING_LEVEL
      targetCode: ORANGE
  expect:
    status: 200
    fields:
      code: 0
      data.suppressStatus: DRAFT
  capture:
    suppressId: data.id
- method: POST
  service: biz
  path: /warning/suppress/${suppressId}/submit
  expect:
    status: 200
    fields:
      code: 0
      data.suppressStatus: ACTIVE
- method: POST
  service: biz
  path: /warning/eval/trigger
  body:
    siteId: 1000000000000050101
    ruleId: ${ruleId}
    factorOverrides:
      ATMO_EFIELD_INSTANT: 9
  expect:
    status: 200
    fields:
      code: 0
      data.candidates.0.warningLevel: ORANGE
- method: GET
  service: biz
  path: /warning/events?pageNum=1&pageSize=1&siteId=1000000000000050101&lifecycleStatus=ACTIVE&warningLevel=ORANGE
  expect:
    status: 200
    fields:
      code: 0
      data.list.0.lifecycleStatus: ACTIVE
      data.list.0.notifySuppressed: 1
      data.list.0.suppressId: ${suppressId}
