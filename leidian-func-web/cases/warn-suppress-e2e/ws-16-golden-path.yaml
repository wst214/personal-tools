id: ws-16-golden-path
name: 黄金路径（创建→提交→终止→删除）
description: 抑制黄金路径：创建草稿→提交生效→终止→删除，覆盖主生命周期。
skip: false
skipReason: ''
steps:
- method: POST
  service: biz
  path: /warning/suppress
  body:
    siteId: 1
    suppressName: 功能测-黄金路径-${rand}
    reason: e2e
    suppressScope: FULL
    timeMode: PERMANENT
    targets:
    - targetType: WARNING_LEVEL
      targetCode: YELLOW
  expect:
    status: 200
    fields:
      code: 0
      data.suppressStatus: DRAFT
  capture:
    suppressId: data.id
- method: PUT
  service: biz
  path: /warning/suppress/${suppressId}
  body:
    siteId: 1
    suppressName: 功能测-黄金路径-${rand}
    reason: e2e-edited
    suppressScope: FULL
    timeMode: PERMANENT
    targets:
    - targetType: WARNING_LEVEL
      targetCode: YELLOW
    - targetType: WARNING_LEVEL
      targetCode: ORANGE
  expect:
    status: 200
    fields:
      code: 0
      data.targetMode: LEVEL
- method: POST
  service: biz
  path: /warning/suppress/${suppressId}/submit
  expect:
    status: 200
    fields:
      code: 0
      data.suppressStatus: ACTIVE
- method: POST
  service: biz
  path: /warning/suppress/${suppressId}/terminate
  body:
    terminateReason: e2e 结束
  expect:
    status: 200
    fields:
      code: 0
      data.suppressStatus: TERMINATED
- method: DELETE
  service: biz
  path: /warning/suppress/${suppressId}
  expect:
    status: 200
    fields:
      code: 0
