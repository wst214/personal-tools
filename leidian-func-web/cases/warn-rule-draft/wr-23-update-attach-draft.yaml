id: wr-23-update-attach-draft
name: 已发布无草稿时更新会挂接新草稿
description: 规则已发布且无草稿时再更新：应自动挂接新的草稿版本，draftVersionId 非空。
skip: false
skipReason: ''
steps:
- method: POST
  service: biz
  path: /warning/rules
  body:
    ruleName: 功能测-挂接草稿-${rand}
    conditionJson: '{"logic":"AND"}'
    actionJson: '{"actionType":"WARNING","warningLevel":"BLUE"}'
    scheduleType: ALWAYS
  expect:
    status: 200
    fields:
      code: 0
  capture:
    ruleId: data.id
- method: POST
  service: biz
  path: /warning/rules/${ruleId}/submit
  expect:
    status: 200
    fields:
      code: 0
      data.ruleStatus: ENABLED
      data.draftVersionId: null
      data.versionStatus: ACTIVE
- method: PUT
  service: biz
  path: /warning/rules/${ruleId}
  body:
    ruleName: 功能测-挂接草稿-${rand}
    conditionJson: '{"logic":"OR"}'
    actionJson: '{"actionType":"WARNING","warningLevel":"YELLOW"}'
    scheduleType: ALWAYS
  expect:
    status: 200
    fields:
      code: 0
      data.ruleStatus: ENABLED
      data.versionStatus: DRAFT
      data.warningLevel: YELLOW
