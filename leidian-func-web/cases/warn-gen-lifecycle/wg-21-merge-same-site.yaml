id: wg-21-merge-same-site
name: 同矿区两条规则命中应归并同一事件
description: 验收：同矿区(siteId=1000000000000050101)两条 BLUE 规则先后命中 -> 归并进同一条事件，命中项 2 条。
skip: false
skipReason: ''
steps:
- method: POST
  service: biz
  path: /warning/rules
  body:
    ruleName: 验收-归并A-${rand}
    ruleDesc: WG-21-A
    conditionJson: '{"logic":"AND","children":[{"factorCode":"ATMO_EFIELD_INSTANT","op":"GTE","value":5}]}'
    actionJson: '{"actionType":"WARNING","warningLevel":"BLUE","notify":{"requireConfirm":false}}'
    foreseeMinutes: 120
    scheduleType: ALWAYS
  expect:
    status: 200
    fields:
      code: 0
      data.ruleStatus: DRAFT
  capture:
    ruleIdA: data.id
- method: POST
  service: biz
  path: /warning/rules/${ruleIdA}/submit
  expect:
    status: 200
    fields:
      code: 0
      data.ruleStatus: ENABLED
- method: POST
  service: biz
  path: /warning/rules
  body:
    ruleName: 验收-归并B-${rand}
    ruleDesc: WG-21-B
    conditionJson: '{"logic":"AND","children":[{"factorCode":"ATMO_EFIELD_INSTANT","op":"GTE","value":5}]}'
    actionJson: '{"actionType":"WARNING","warningLevel":"BLUE","notify":{"requireConfirm":false}}'
    foreseeMinutes: 120
    scheduleType: ALWAYS
  expect:
    status: 200
    fields:
      code: 0
      data.ruleStatus: DRAFT
  capture:
    ruleIdB: data.id
- method: POST
  service: biz
  path: /warning/rules/${ruleIdB}/submit
  expect:
    status: 200
    fields:
      code: 0
      data.ruleStatus: ENABLED
- method: POST
  service: biz
  path: /warning/eval/trigger
  body:
    siteId: 1000000000000050101
    ruleId: ${ruleIdA}
    factorOverrides:
      ATMO_EFIELD_INSTANT: 9
  expect:
    status: 200
    fields:
      code: 0
      data.candidates.0.warningLevel: BLUE
- method: POST
  service: biz
  path: /warning/eval/trigger
  body:
    siteId: 1000000000000050101
    ruleId: ${ruleIdB}
    factorOverrides:
      ATMO_EFIELD_INSTANT: 9
  expect:
    status: 200
    fields:
      code: 0
      data.candidates.0.warningLevel: BLUE
- method: GET
  service: biz
  path: /warning/events?pageNum=1&pageSize=1&siteId=1000000000000050101&lifecycleStatus=ACTIVE&warningLevel=BLUE
  expect:
    status: 200
    fields:
      code: 0
      data.list.0.lifecycleStatus: ACTIVE
  capture:
    eventId: data.list.0.id
- method: GET
  service: biz
  path: /warning/events/${eventId}
  expect:
    status: 200
    fields:
      code: 0
      data.itemCount: 2
      data.items.0.triggerType: RULE_HIT
      data.items.1.triggerType: RULE_HIT
