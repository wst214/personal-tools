id: wg-23-renew-same-level
name: 预见期内同级再命中应续期不新增命中项
description: 验收：同规则同等级再次命中 -> 续期(foresee_deadline 刷新)、不新增命中项(itemCount 仍 1)。
skip: true
skipReason: 预警相关代码已移除；整包用例跳过
steps:
- method: POST
  service: biz
  path: /warning/rules
  body:
    ruleName: 验收-续期-${rand}
    ruleDesc: WG-23
    conditionJson: '{"logic":"AND","children":[{"factorCode":"ATMO_EFIELD_INSTANT","op":"GTE","value":5}]}'
    actionJson: '{"actionType":"WARNING","warningLevel":"BLUE","notify":{"requireConfirm":false}}'
    foreseeMinutes: 180
    scheduleType: ALWAYS
  expect:
    status: 200
    fields:
      code: 0
      data.ruleStatus: DRAFT
  capture:
    ruleId: data.id
- method: POST
  service: biz
  path: /warning/rules/${ruleId}/submit
  expect:
    status: 200
    fields:
      code: 0
      data.ruleStatus: ENABLED
- method: POST
  service: biz
  path: /warning/eval/trigger
  body:
    siteId: 1000000000000050101
    ruleId: ${ruleId}
    factorOverrides:
      ATMO_EFIELD_INSTANT: 9
  expect:
    status: 200
    fields:
      code: 0
      data.candidates.0.warningLevel: BLUE
- method: GET
  service: biz
  path: /warning/events?pageNum=1&pageSize=1&siteId=1000000000000050101&lifecycleStatus=ACTIVE&warningLevel=BLUE
  expect:
    status: 200
    fields:
      code: 0
  capture:
    eventId: data.list.0.id
    itemCount: data.list.0.id
- method: GET
  service: biz
  path: /warning/events/${eventId}
  expect:
    status: 200
    fields:
      code: 0
  capture:
    itemCountBefore: data.itemCount
- method: POST
  service: biz
  path: /warning/eval/trigger
  body:
    siteId: 1000000000000050101
    ruleId: ${ruleId}
    factorOverrides:
      ATMO_EFIELD_INSTANT: 12
  expect:
    status: 200
    fields:
      code: 0
      data.candidates.0.warningLevel: BLUE
- method: GET
  service: biz
  path: /warning/events/${eventId}
  expect:
    status: 200
    fields:
      code: 0
      data.warningLevel: BLUE
      data.lifecycleStatus: ACTIVE
      data.itemCount: ${itemCountBefore}
