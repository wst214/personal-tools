id: wg-33-suppressed-visibility
name: SUPPRESSED 默认不可见、includeHidden 可查
description: 验收：FULL 抑制产生的 SUPPRESSED 事件，默认列表排除(lifecycleStatus=SUPPRESSED 查不到)，includeHidden=true 可查。
skip: false
skipReason: ''
steps:
- method: POST
  service: biz
  path: /warning/rules
  body:
    ruleName: 验收-可见性-${rand}
    ruleDesc: WG-33
    conditionJson: '{"logic":"AND","children":[{"factorCode":"ATMO_EFIELD_INSTANT","op":"GTE","value":5}]}'
    actionJson: '{"actionType":"WARNING","warningLevel":"YELLOW","notify":{"requireConfirm":false}}'
    foreseeMinutes: 60
    scheduleType: ALWAYS
  expect:
    status: 200
    fields:
      code: 0
      data.ruleStatus: DRAFT
  capture:
    ruleId: data.id
- method: POST
  service: biz
  path: /warning/rules/${ruleId}/submit
  expect:
    status: 200
    fields:
      code: 0
      data.ruleStatus: ENABLED
- method: POST
  service: biz
  path: /warning/suppress
  body:
    siteId: 1000000000000050101
    suppressName: 验收-可见性抑制-${rand}
    reason: WG-33
    suppressScope: FULL
    timeMode: PERMANENT
    targets:
    - targetType: WARNING_LEVEL
      targetCode: YELLOW
  expect:
    status: 200
    fields:
      code: 0
      data.suppressStatus: DRAFT
  capture:
    suppressId: data.id
- method: POST
  service: biz
  path: /warning/suppress/${suppressId}/submit
  expect:
    status: 200
    fields:
      code: 0
      data.suppressStatus: ACTIVE
- method: POST
  service: biz
  path: /warning/eval/trigger
  body:
    siteId: 1000000000000050101
    ruleId: ${ruleId}
    factorOverrides:
      ATMO_EFIELD_INSTANT: 9
  expect:
    status: 200
    fields:
      code: 0
      data.candidates.0.warningLevel: YELLOW
- method: GET
  service: biz
  path: /warning/events?pageNum=1&pageSize=5&siteId=1000000000000050101&lifecycleStatus=SUPPRESSED
  expect:
    status: 200
    fields:
      code: 0
      data.total: 0
- method: GET
  service: biz
  path: /warning/events?pageNum=1&pageSize=5&siteId=1000000000000050101&lifecycleStatus=SUPPRESSED&includeHidden=true
  expect:
    status: 200
    fields:
      code: 0
      data.list.0.lifecycleStatus: SUPPRESSED
      data.list.0.suppressId: ${suppressId}
