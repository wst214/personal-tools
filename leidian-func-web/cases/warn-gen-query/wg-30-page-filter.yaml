id: wg-30-page-filter
name: 事件列表可按状态等级矿区筛到目标事件
description: 验收：trigger 落事件后，按 siteId/lifecycleStatus/warningLevel 过滤能查到。
skip: false
skipReason: ''
steps:
- method: POST
  service: biz
  path: /warning/rules
  body:
    ruleName: 验收-列表筛选-${rand}
    ruleDesc: WG-30
    conditionJson: '{"logic":"AND","children":[{"factorCode":"ATMO_EFIELD_INSTANT","op":"GTE","value":5}]}'
    actionJson: '{"actionType":"WARNING","warningLevel":"BLUE","notify":{"requireConfirm":false}}'
    foreseeMinutes: 60
    scheduleType: ALWAYS
  expect:
    status: 200
    fields:
      code: 0
      data.ruleStatus: DRAFT
  capture:
    ruleId: data.id
- method: POST
  service: biz
  path: /warning/rules/${ruleId}/submit
  expect:
    status: 200
    fields:
      code: 0
      data.ruleStatus: ENABLED
- method: POST
  service: biz
  path: /warning/eval/trigger
  body:
    siteId: 1000000000000050101
    ruleId: ${ruleId}
    factorOverrides:
      ATMO_EFIELD_INSTANT: 9
  expect:
    status: 200
    fields:
      code: 0
      data.candidates.0.warningLevel: BLUE
- method: GET
  service: biz
  path: /warning/events?pageNum=1&pageSize=20&siteId=1000000000000050101&lifecycleStatus=ACTIVE&warningLevel=BLUE
  expect:
    status: 200
    fields:
      code: 0
      data.list.0.lifecycleStatus: ACTIVE
      data.list.0.warningLevel: BLUE
      data.list.0.siteId: 1000000000000050101
