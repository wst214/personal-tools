id: wb-01-test-enabled-rule
name: 可对已启用规则发起回测
description: 【暂不执行】验收：可对已启用规则发起历史回测。
skip: true
skipReason: 能力未上线；本用例按验收标准编写，上线后取消 skip 即可跑
steps:
- method: POST
  service: biz
  path: /warning/rules
  expect:
    status: 200
    fields:
      code: 0
  body:
    ruleName: 验收-回测启用-${rand}
    conditionJson: '{}'
    actionJson: '{"actionType":"WARNING","warningLevel":"BLUE"}'
    scheduleType: ALWAYS
  capture:
    ruleId: data.id
- method: POST
  service: biz
  path: /warning/rules/${ruleId}/submit
  expect:
    status: 200
    fields:
      code: 0
- method: POST
  service: biz
  path: /warning/rules/${ruleId}/test
  expect:
    status: 200
    fields:
      code: 0
  body:
    from: ${now-1d}
    to: ${now+0s}
  capture:
    testId: data.id
