id: ws-17-create-device-only
name: 新建抑制草稿（纯 DEVICE）
description: 新建仅 DEVICE 目标的抑制草稿，期望 targetMode=DEVICE。
skip: false
skipReason: ''
steps:
- method: POST
  service: biz
  path: /warning/suppress
  body:
    siteId: 1
    suppressName: 功能测-纯设备-${rand}
    reason: device-only
    suppressScope: FULL
    timeMode: PERMANENT
    targets:
    - targetType: DEVICE
      targetId: 2001
      targetCode: DEV-2001
      targetName: 功能测设备
  expect:
    status: 200
    fields:
      code: 0
      data.suppressStatus: DRAFT
      data.targetMode: DEVICE
  capture:
    suppressId: data.id
