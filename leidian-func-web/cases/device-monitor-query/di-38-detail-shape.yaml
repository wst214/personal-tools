id: di-38-detail-shape
name: 监测详情响应结构
description: |
  断接卡列表取首台 → 详情须含 basicInfo 关键字段，且 data.points 为数组（允许空，无监测点时）。
skip: false
skipReason: ''
steps:
- name: 列表取 deviceId
  method: GET
  service: biz
  path: /monitor/disconnect-card/disconnect-cards?pageNum=1&pageSize=10
  expect:
    status: 200
    fields:
      code: 0
      data.list.0.id: __not_empty__
  capture:
    deviceId: data.list.0.id
- name: 详情结构
  method: GET
  service: biz
  path: /monitor/disconnect-card/devices/${deviceId}
  expect:
    status: 200
    fields:
      code: 0
      data.basicInfo.deviceName: __not_empty__
      data.basicInfo.deviceAddr: __not_empty__
      data.basicInfo.deviceTypeName: __not_empty__
    contains:
    - path: data.points
