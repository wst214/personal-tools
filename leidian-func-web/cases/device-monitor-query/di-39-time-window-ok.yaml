id: di-39-time-window-ok
name: 合法时间窗列表可查
description: |
  接地电阻默认跨度上限 30 天；传入近 7 天合法窗口应成功。
  仅验 code 与 list 为数组，不要求窗口内一定有监测点。
skip: false
skipReason: ''
steps:
- name: 接地电阻合法时间窗
  method: GET
  service: biz
  path: /monitor/grounding/groundings?pageNum=1&pageSize=10&startTime=${localNow-7d}&endTime=${localNow-0s}
  expect:
    status: 200
    fields:
      code: 0
    contains:
    - path: data.list
- name: SPD 波形合法时间窗
  method: GET
  service: biz
  path: /monitor/spd-waveform/spd-waveforms?pageNum=1&pageSize=10&startTime=${localNow-7d}&endTime=${localNow-0s}
  expect:
    status: 200
    fields:
      code: 0
    contains:
    - path: data.list
